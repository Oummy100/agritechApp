<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
    <link href="/css/main.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-warning d-flex flex-column justify-content-center align-items-center min-vh-100">

    <div class="d-flex align-items-center justify-content-center col-11 col-sm-8 col-md-6 col-lg-4 col-xl-3 mb-3">
        <img src="../asset/favico.png" alt="" class="img-fluid" style="width: 60px;">
        <h1 class="ms-2 fs-3 fs-md-1">Agritech App</h1>
    </div>
    
    <section class="container-fluid col-11 col-sm-8 col-md-6 col-lg-4 col-xl-3 bg-success page-login text-white rounded-4 p-3 p-md-4 mt-3 d-flex flex-column gap-3">
        <h2 class="text-center">Login</h2>
        
        <div>
            <label for="inputEmail5" class="form-label">Veuillez saisir votre Email</label>
            <input type="email" id="inputEmail5" class="form-control" aria-describedby="emailHelpBlock" placeholder="Email" required>
        </div>

        <div>
            <label for="inputPassword5" class="form-label">Veuillez saisir votre mot de passe</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock" placeholder="Password" required>
        </div>
        
        <div>
            <input type="radio">
            <label>Se souvenir de moi</label>
        </div>
        
        <div class="text-end">
            <button class="border-0 rounded-pill p-3 px-4"><a href="../index.html" class="text-white text-decoration-none">Login <i class="bi bi-arrow-up-right"></i></a></button>
        </div>
        
        <p class="mb-0">Veuillez contacter un administrateur si vous avez oublié votre mot de passe</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
